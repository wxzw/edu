server:
  port: 8055
  servlet:
    context-path: /
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

spring:
  application:
    name: edu-backend
  profiles:
    active: local
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/edu_group
    username: postgres
    password: postgres
    hikari:
      pool-name: edu-hikari
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 2
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: "edu-group-backend-local-secret-change-before-production-2026"
    access-token-ttl: 2h
    refresh-token-ttl: 7d
  tenant:
    header-name: X-Campus-Id
  wechat:
    miniapp:
      app-id: ""
      app-secret: ""
      mock-enabled: true

logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: info
    com.community.edu: debug
    org.springframework.security: info
